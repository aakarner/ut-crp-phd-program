title: CRP PhD Program Policies
description: PhD policies and procedures of the Graduate Program in Community and Regional Planning, School of Architecture, The University of Texas at Austin
url: https://aakarner.github.io
baseurl: /ut-crp-phd-program

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

search_enabled: true
heading_anchors: true
color_scheme: light

aux_links:
  "Repository on GitHub":
    - https://github.com/aakarner/ut-crp-phd-program

footer_content: "Maintained by <a href=\"https://soa.utexas.edu/faculty/alex-karner\">Alex Karner</a>, PhD Program Coordinator, Graduate Program in Community and Regional Planning, The University of Texas at Austin."

# Status labels used in policy front matter
callouts:
  adopted:
    title: Adopted
    color: green
  draft:
    title: Draft — under GSC review
    color: yellow

exclude:
  - README.md
  - LICENSE
  - "*.diff"
  - "*.txt"
